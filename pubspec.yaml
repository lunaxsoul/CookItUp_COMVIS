name: food_classifier_app
description: "Food identification application from images using on-device machine learning (TensorFlow Lite / LiteRT)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  http: ^1.2.2
  google_fonts: ^8.2.1
  photo_manager: ^3.12.0
  camera: ^0.12.1
  path_provider_foundation: 2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  material_color_utilities: ^0.13.1
  test_api: ^0.7.14
  cli_util: ^0.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/food_classifier.tflite
    - assets/models/labels.txt
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

